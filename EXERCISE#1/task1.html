<!DOCTYPE html>
<html>

<head>
    <title>Position Example</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h3>position: static</h3>

<div class="container static-example">
    <div class="box red">One</div>
    <div class="box green static-box">Two</div>
    <div class="box red">Three</div>
    <div class="box red">Four</div>
</div>


<h3>position: relative</h3>

<div class="container relative-example">
    <div class="box red">One</div>
    <div class="box green relative-box">Two</div>
    <div class="box red">Three</div>
    <div class="box red">Four</div>
</div>


<h3>position: absolute</h3>

<div class="container absolute-example">
    <div class="box red">One</div>
    <div class="box green absolute-box">Two</div>
    <div class="box red">Three</div>
    <div class="box red">Four</div>
</div>

</body>

</html>
